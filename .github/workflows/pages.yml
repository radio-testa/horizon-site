name: Sincronizza HORIZON Pages
on:
  release:
    types: [published, unpublished, edited, deleted]
  workflow_dispatch:
  schedule:
    - cron: '27 4 * * *'
permissions: {}
concurrency:
  group: horizon-pages
  cancel-in-progress: false
jobs:
  build:
    if: vars.HORIZON_PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verifiche locali
        run: node tests/catalog.test.mjs
      - name: Genera il sito
        env:
          GH_TOKEN: ${{ github.token }}
          HORIZON_DISTRIBUTION_ENABLED: ${{ vars.HORIZON_DISTRIBUTION_ENABLED }}
        run: node hosting/build.mjs dist
      - name: Verifica artefatto Pages
        run: node hosting/verify-build.mjs dist
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e


